<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"><link rel="stylesheet" href="shell.css"><title>成子</title></head><body>
<aside><div class="brand"><img src="logo.png" alt="成子"><div><strong>成子</strong><span>关系决策工作区</span></div></div>
<button class="import" data-route="capture"><span>＋</span> 导入微信资料</button>
<div class="section-label">工作区</div><nav aria-label="主要功能">
<button data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11H3Z"/><path d="M9 21v-8h6v8"/></svg>首页</button>
<button data-route="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6Z"/><path d="M14 3v5h5M9 12h7M9 16h5"/></svg>我的报告</button>
<button data-route="people"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v3"/></svg>人物档案</button>
<button data-route="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 0 1-9 9 10 10 0 0 1-4-1l-5 2 2-5a9 9 0 1 1 16-5Z"/></svg>问成子</button>
</nav>
<div class="bottom"><div class="local-state"><i></i><span id="collector">按需启动本机采集</span></div><button data-route="account">账户与积分 <span>↗</span></button><small id="version">桌面预览版</small></div></aside>
<header><div class="history"><button id="back" data-action="back" title="返回上一页（Alt + ←）" aria-label="返回上一页">←</button><button id="forward" data-action="forward" title="前进" aria-label="前进">→</button><button data-action="reload" title="刷新工作区" aria-label="刷新工作区">↻</button></div><span id="location">首页</span><div class="connection"><i id="network-dot"></i><span id="network">在线工作区</span></div></header>
<main><div id="fallback"><div class="eyebrow">成子 · 桌面工作区</div><h1 id="title">正在打开工作区</h1><p id="description">聊天、朋友圈与报告，都在这里接着看。</p><button data-action="reload" id="retry" hidden>重新打开工作区 →</button><p class="note">已保存的资料和报告仍保留在你的账号中。</p></div></main>
<div id="notice" role="status" hidden><span id="notice-text"></span><button data-action="dismiss" aria-label="关闭提示">×</button></div><script src="shell.js"></script></body></html>

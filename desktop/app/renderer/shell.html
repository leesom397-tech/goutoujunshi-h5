<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
  <link rel="stylesheet" href="shell.css">
  <title>成子</title>
</head>
<body data-loading="true" data-failed="false">
  <aside aria-label="应用侧栏">
    <div class="brand"><img src="logo.png" alt="" width="42" height="42"><div><strong>成子</strong><span>关系决策工作区</span></div></div>
    <button class="import" data-route="capture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>导入微信资料</span></button>
    <nav aria-label="主要功能">
      <button data-route="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v11H3Z"/><path d="M9 21v-8h6v8"/></svg><span>工作台</span></button>
      <button data-route="reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6Z"/><path d="M14 3v5h5M9 12h7M9 16h5"/></svg><span>我的报告</span></button>
      <button data-route="people"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v3"/></svg><span>人物档案</span></button>
      <button data-route="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11a9 9 0 0 1-9 9 10 10 0 0 1-4-1l-5 2 2-5a9 9 0 1 1 16-5Z"/></svg><span>问成子</span></button>
    </nav>
    <div class="bottom">
      <button class="local-state" data-action="setup" data-state="stopped" title="本机采集设置"><i aria-hidden="true"></i><span id="collector">按需启动本机采集</span><svg class="state-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      <button class="account" data-route="account"><span class="account-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></span><span>账户与积分</span><svg class="account-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
      <div class="version-row"><span>桌面版</span><small id="version">开发预览</small></div>
    </div>
  </aside>
  <header>
    <div class="history" aria-label="页面导航">
      <button id="back" data-action="back" title="返回上一页（Alt + ←）" aria-label="返回上一页" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h15"/></svg><span>返回</span></button>
      <button id="forward" data-action="forward" title="前进" aria-label="前进" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5 7 7-7 7M4 12h15"/></svg></button>
      <button data-action="reload" title="刷新工作区" aria-label="刷新工作区"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.3 7a8 8 0 0 1 13.2-1L20 8M4 16l1.5 2A8 8 0 0 0 18.7 17"/></svg></button>
    </div>
    <span class="toolbar-divider" aria-hidden="true"></span><span id="location">工作台</span>
    <div class="connection"><i id="network-dot" aria-hidden="true"></i><span id="network">正在打开…</span></div>
  </header>
  <main><div id="fallback">
    <div class="fallback-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="6"/><path d="M12 5v22M12 12h15M17 18h5M17 22h3"/></svg></div>
    <h1 id="title">正在打开工作区</h1><p id="description">聊天、朋友圈与报告，都在这里接着看。</p>
    <div class="loading-line" aria-hidden="true"><span></span></div>
    <button data-action="reload" id="retry" hidden>重新打开工作区<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5 7 7-7 7M4 12h15"/></svg></button>
    <p class="note">已保存的资料和报告仍保留在你的账号中。</p>
  </div></main>
  <div id="notice" role="status" aria-live="polite" hidden><span id="notice-text"></span><button data-action="dismiss" aria-label="关闭提示"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <script src="shell.js"></script>
</body>
</html>
